<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="cherryGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b80003"/>
      <stop offset="100%" style="stop-color:#9a0002"/>
    </linearGradient>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b96a"/>
      <stop offset="100%" style="stop-color:#C6A85D"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9a0002" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle (optional, for social media profile use) -->
  <circle cx="70" cy="70" r="65" fill="#FAF8F3" stroke="#C6A85D" stroke-width="2" opacity="0.3"/>

  <!-- Heart Icon -->
  <g transform="translate(10, 18)" filter="url(#iconShadow)">
    <!-- Left half -->
    <path d="M 60,12 
             C 60,4 48,0 36,0 
             C 16,0 4,12 4,28 
             C 4,50 32,72 60,94 
             L 60,12 Z" 
          fill="url(#cherryGradIcon)"/>
    <!-- Right half -->
    <path d="M 60,12 
             C 60,4 72,0 84,0 
             C 104,0 116,12 116,28 
             C 116,50 88,72 60,94 
             L 60,12 Z" 
          fill="url(#goldGradIcon)"/>
    <!-- Cross -->
    <g transform="translate(60, 44)">
      <rect x="-6" y="-20" width="12" height="40" rx="2.5" fill="#FAF8F3"/>
      <rect x="-22" y="-6" width="44" height="12" rx="2.5" fill="#FAF8F3"/>
      <circle cx="0" cy="0" r="3.5" fill="#C6A85D" opacity="0.4"/>
    </g>
    <!-- Connection rings -->
    <circle cx="36" cy="28" r="16" fill="none" stroke="#FAF8F3" stroke-width="1.5" opacity="0.2"/>
    <circle cx="84" cy="28" r="16" fill="none" stroke="#FAF8F3" stroke-width="1.5" opacity="0.2"/>
  </g>
</svg>