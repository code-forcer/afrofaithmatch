<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280">
  <defs>
    <linearGradient id="cherryGradStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b80003"/>
      <stop offset="100%" style="stop-color:#9a0002"/>
    </linearGradient>
    <linearGradient id="goldGradStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b96a"/>
      <stop offset="100%" style="stop-color:#C6A85D"/>
    </linearGradient>
    <filter id="stackShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9a0002" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(100, 15)" filter="url(#stackShadow)">
    <path d="M 60,15 
             C 60,5 45,0 30,0 
             C 12,0 0,12 0,30 
             C 0,55 30,80 60,105 
             L 60,15 Z" 
          fill="url(#cherryGradStack)"/>
    <path d="M 60,15 
             C 60,5 75,0 90,0 
             C 108,0 120,12 120,30 
             C 120,55 90,80 60,105 
             L 60,15 Z" 
          fill="url(#goldGradStack)"/>
    <g transform="translate(60, 48)">
      <rect x="-6" y="-24" width="12" height="48" rx="2.5" fill="#FAF8F3"/>
      <rect x="-22" y="-8" width="44" height="12" rx="2.5" fill="#FAF8F3"/>
      <circle cx="0" cy="-2" r="3.5" fill="#C6A85D" opacity="0.35"/>
    </g>
    <circle cx="30" cy="30" r="18" fill="none" stroke="#FAF8F3" stroke-width="1.5" opacity="0.2"/>
    <circle cx="90" cy="30" r="18" fill="none" stroke="#FAF8F3" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(160, 155)" text-anchor="middle">
    <text x="0" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" fill="#9a0002" letter-spacing="-0.5">Afro<tspan fill="#C6A85D">Faith</tspan>Match</text>
    <text x="0" y="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#9a0002" opacity="0.6" letter-spacing="4">WHERE FAITH LEADS TO LOVE</text>
    <line x1="-60" y1="45" x2="60" y2="45" stroke="#C6A85D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>